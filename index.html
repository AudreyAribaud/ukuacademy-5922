<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UkuAcademy - Apprendre le Ukulélé</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6200ee">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="dark-theme">
  <header>
    <div class="header-left">
      <h1>UkuAcademy 🎵</h1>
    </div>
    <div class="header-right">
      <button id="installBtn" class="btn-icon" title="Installer l'application" style="display: none;">📥</button>
      <button id="themeToggle" class="btn-icon" title="Changer de thème">☀️</button>
    </div>
  </header>

  <main>
    <!-- TAB 1: PROGRESSIONS & ACCORDS -->
    <section id="tab-progressions" class="tab-content active">
      <div class="section-header">
        <select id="genreFilter">
          <option value="all">Tous les styles</option>
          <option value="Pop">Pop</option>
          <option value="Folk">Folk</option>
          <option value="Jazz">Jazz</option>
          <option value="Blues">Blues</option>
          <option value="Classique">Classique</option>
        </select>
        <span class="badge" id="progCount">50 suites</span>
      </div>
      
      <div class="split-container">
        <div class="list-container" id="progressionsList"></div>
        <div class="preview-container">
          <div id="selectedProgressionInfo">
            <p class="placeholder-text">Sélectionnez un enchaînement pour voir les accords</p>
          </div>
          <div id="chordDiagramsContainer"></div>
        </div>
      </div>
    </section>

    <!-- TAB 2: RYTHMES -->
    <section id="tab-rhythms" class="tab-content">
      <div class="rhythms-container">
        <div class="list-container" id="rhythmsList"></div>
        <div class="rhythm-preview" id="rhythmPreview">
          <h3 id="rhythmTitle">Sélectionnez un rythme</h3>
          <div class="strumming-visual" id="strummingVisual"></div>
          <p id="rhythmDescription" class="description"></p>
          <button id="playRhythmBtn" class="btn-primary">Écouter le tempo</button>
        </div>
      </div>
    </section>

    <!-- TAB 3: ACCORDEUR -->
    <section id="tab-tuner" class="tab-content">
      <div class="tuner-card">
        <h2>Accordeur de Référence</h2>
        <p class="subtitle">Cliquez sur une corde pour entendre la note parfaite (G-C-E-A)</p>
        <div class="ukulele-head">
          <div class="peg-left">
            <button class="peg-btn" data-note="G">G (Sol)</button>
            <button class="peg-btn" data-note="C">C (Do)</button>
          </div>
          <div class="neck-visual"></div>
          <div class="peg-right">
            <button class="peg-btn" data-note="E">E (Mi)</button>
            <button class="peg-btn" data-note="A">A (La)</button>
          </div>
        </div>
        <div class="tuner-controls">
          <button id="stopTunerBtn" class="btn-secondary">Arrêter le son</button>
        </div>
      </div>
    </section>

    <!-- TAB 4: METRONOME -->
    <section id="tab-metronome" class="tab-content">
      <div class="metronome-card">
        <h2>Métronome</h2>
        <div class="visual-indicator" id="metroVisual"></div>
        <div class="bpm-display">
          <span id="bpmValue">120</span> <span class="bpm-unit">BPM</span>
        </div>
        <div class="slider-container">
          <button class="btn-round" id="bpmMinus">-</button>
          <input type="range" id="bpmSlider" min="40" max="240" value="120">
          <button class="btn-round" id="bpmPlus">+</button>
        </div>
        <div class="time-signature">
          <button class="sig-btn active" data-sig="4">4/4</button>
          <button class="sig-btn" data-sig="3">3/4</button>
          <button class="sig-btn" data-sig="2">2/4</button>
        </div>
        <button id="metroPlayBtn" class="btn-primary btn-large">DÉMARRER</button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="tab-progressions">
      <span class="nav-icon">🎸</span>
      <span class="nav-label">Accords</span>
    </button>
    <button class="nav-item" data-tab="tab-rhythms">
      <span class="nav-icon">🥁</span>
      <span class="nav-label">Rythmes</span>
    </button>
    <button class="nav-item" data-tab="tab-tuner">
      <span class="nav-icon">🔧</span>
      <span class="nav-label">Accordeur</span>
    </button>
    <button class="nav-item" data-tab="tab-metronome">
      <span class="nav-icon">⏱️</span>
      <span class="nav-label">Métronome</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
