<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UkuAcademy - Grilles d'Accords</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8B4513">
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪕</text></svg>">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-title">
        <span class="logo-icon">🪕</span>
        <h1>UkuAcademy</h1>
      </div>
      <div class="selectors">
        <select id="progression-select" aria-label="Sélectionner une progression">
          <option value="pop">Pop/Rock (I-V-vi-IV)</option>
          <option value="classic">Classic 50s (I-vi-IV-V)</option>
          <option value="jazz">Jazz (ii-V-I)</option>
          <option value="blues">Blues (I-IV-V)</option>
          <option value="folk">Folk (vi-IV-I-V)</option>
        </select>
        <select id="key-select" aria-label="Sélectionner la tonalité">
          <option value="C">Tonalité : Do (C)</option>
          <option value="G">Tonalité : Sol (G)</option>
          <option value="F">Tonalité : Fa (F)</option>
        </select>
      </div>
    </header>

    <main class="grid-container" id="chords-grid">
      <!-- Les cartes d'accords seront injectées ici dynamiquement -->
    </main>

    <footer class="app-controls">
      <div class="playback-bar">
        <button id="play-btn" class="control-btn primary-btn">
          <span class="btn-icon">▶</span> <span class="btn-text">Jouer la suite</span>
        </button>
        <div class="tempo-control">
          <label for="tempo-range">Tempo: <span id="tempo-val">100</span> BPM</label>
          <input type="range" id="tempo-range" min="60" max="180" value="100">
        </div>
      </div>
      <div class="info-bar">
        <p class="tip-text">Tapez sur un accord pour l'écouter • Aucun défilement requis !</p>
      </div>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
