<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UkuFlow - Apprendre le Ukulélé</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8B5CF6">
  <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1510915361894-db8b60106cb1?auto=format&fit=crop&w=192&h=192">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-area">
        <span class="logo-icon">🌴</span>
        <h1>UkuFlow</h1>
      </div>
      <div class="header-actions">
        <button id="install-btn" class="btn-icon hidden" title="Installer l'application">
          📥
        </button>
        <button id="theme-toggle" class="btn-icon" aria-label="Changer de thème">
          🌙
        </button>
      </div>
    </header>

    <main class="app-content">
      <!-- TAB 1: CHORDS -->
      <section id="tab-chords" class="tab-panel active">
        <div class="chord-selector">
          <div class="chord-grid" id="chord-buttons-grid"></div>
        </div>
        <div class="chord-display-card">
          <h2 id="current-chord-name">C (Do)</h2>
          <div class="fretboard-container">
            <svg id="fretboard-svg" viewBox="0 0 120 160"></svg>
          </div>
          <button id="play-chord-btn" class="btn-primary">🔊 Jouer l'accord</button>
        </div>
      </section>

      <!-- TAB 2: PROGRESSIONS -->
      <section id="tab-progressions" class="tab-panel">
        <div class="section-header">
          <h2>Suites d'accords magiques</h2>
          <p>Des enchaînements parfaits pour débuter</p>
        </div>
        <div class="progressions-list" id="progressions-container"></div>
        <div class="progression-player">
          <button id="play-progression-btn" class="btn-primary">▶️ Jouer la suite</button>
          <button id="stop-progression-btn" class="btn-secondary hidden">⏹️ Arrêter</button>
        </div>
      </section>

      <!-- TAB 3: TUNER -->
      <section id="tab-tuner" class="tab-panel">
        <div class="tuner-card">
          <h2>Accordeur de Poche</h2>
          <p>Accordage standard (G C E A)</p>
          <div class="tuner-pegs">
            <button class="peg-btn" data-note="G"><strong>G</strong> <small>Sol</small></button>
            <button class="peg-btn" data-note="C"><strong>C</strong> <small>Do</small></button>
            <button class="peg-btn" data-note="E"><strong>E</strong> <small>Mi</small></button>
            <button class="peg-btn" data-note="A"><strong>A</strong> <small>La</small></button>
          </div>
          <div class="tuner-tip">
            <p>Appuyez sur une corde pour entendre la note de référence.</p>
          </div>
        </div>
      </section>
    </main>

    <nav class="app-nav">
      <button class="nav-item active" data-tab="tab-chords">
        <span class="nav-icon">🎸</span>
        <span class="nav-label">Accords</span>
      </button>
      <button class="nav-item" data-tab="tab-progressions">
        <span class="nav-icon">🎶</span>
        <span class="nav-label">Suites</span>
      </button>
      <button class="nav-item" data-tab="tab-tuner">
        <span class="nav-icon">🔔</span>
        <span class="nav-label">Accordeur</span>
      </button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
