<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UkuLearn</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
</head>
<body class="dark-theme">
  <header>
    <div class="logo">
      <span class="icon">🎸</span>
      <h1>UkuLearn</h1>
    </div>
    <div class="actions">
      <button id="btn-install" class="btn-icon" style="display: none;" title="Installer l'application">📥</button>
      <button id="btn-theme" class="btn-icon" title="Changer de thème">🌓</button>
    </div>
  </header>

  <main>
    <!-- TAB 1: ACCORDS -->
    <section id="tab-chords" class="tab-content active">
      <div class="chord-grid" id="chord-selector"></div>
      <div class="chord-display">
        <h2 id="chord-name">C</h2>
        <div class="svg-container">
          <svg id="chord-svg" viewBox="0 0 100 120" width="100%" height="100%"></svg>
        </div>
        <button id="btn-play-chord" class="btn-primary">Strummer 🔊</button>
      </div>
    </section>

    <!-- TAB 2: SUITES D'ACCORDS -->
    <section id="tab-progressions" class="tab-content">
      <div class="progression-list" id="progression-list"></div>
      <div class="progression-controls">
        <div class="tempo-control">
          <div class="tempo-label">
            <span>Tempo</span>
            <span id="tempo-val">100 BPM</span>
          </div>
          <input type="range" id="tempo" min="60" max="180" value="100">
        </div>
        <button id="btn-play-prog" class="btn-primary">Jouer la Suite ▶️</button>
      </div>
    </section>

    <!-- TAB 3: ACCORDEUR -->
    <section id="tab-tuner" class="tab-content">
      <div class="tuner-instruction">Tapez une corde pour entendre sa note de référence</div>
      <div class="tuner-grid">
        <button class="tuner-key" data-note="G"><strong>G</strong><span class="freq">392 Hz</span></button>
        <button class="tuner-key" data-note="C"><strong>C</strong><span class="freq">261 Hz</span></button>
        <button class="tuner-key" data-note="E"><strong>E</strong><span class="freq">329 Hz</span></button>
        <button class="tuner-key" data-note="A"><strong>A</strong><span class="freq">440 Hz</span></button>
      </div>
      <div class="tuner-visualizer">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="chords">
      <span class="nav-icon">🎼</span>
      <span class="nav-label">Accords</span>
    </button>
    <button class="nav-item" data-tab="progressions">
      <span class="nav-icon">🔄</span>
      <span class="nav-label">Suites</span>
    </button>
    <button class="nav-item" data-tab="tuner">
      <span class="nav-icon">🔔</span>
      <span class="nav-label">Accordeur</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
