<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UkuAcademy - Apprendre le Ukulélé</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="dark-mode">
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <h1>UkuAcademy 🎵</h1>
      </div>
      <div class="header-right">
        <button id="install-btn" class="btn-icon hidden" title="Installer l'application">
          📥
        </button>
        <button id="theme-toggle" class="btn-icon" title="Changer de thème">
          🌓
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="app-content">
      <!-- SECTION 1: CHORDS & PROGRESSIONS -->
      <section id="sec-chords" class="tab-content active">
        <!-- Large Chord Display Panel -->
        <div class="chord-viewer-card">
          <div class="chord-viewer-header">
            <h2 id="current-chord-name">Accord : C (Do)</h2>
            <button id="play-chord-btn" class="btn-primary">🔊 Écouter l'accord</button>
          </div>
          <div class="chord-viewer-body">
            <div id="chord-svg-container"></div>
          </div>
        </div>

        <!-- Progressions List -->
        <div class="progressions-panel">
          <div class="panel-header">
            <h3>50 Enchaînements d'Accords</h3>
            <select id="genre-filter" class="select-input">
              <option value="all">Tous les styles</option>
              <option value="pop">Pop / Variété</option>
              <option value="folk">Folk / Acoustique</option>
              <option value="jazz">Jazz / Blues</option>
              <option value="sad">Mélancolique</option>
              <option value="happy">Joyeux / Rythmé</option>
            </select>
          </div>
          <div class="progressions-list" id="progressions-container">
            <!-- Dynamic content -->
          </div>
        </div>

        <!-- Rhythm Patterns -->
        <div class="rhythm-panel">
          <h3>Rythmiques Conseillées</h3>
          <div class="rhythm-selector">
            <button class="rhythm-tab active" data-rhythm="0">Feu de Camp (Bas, Bas-Haut, Haut-Bas-Haut)</button>
            <button class="rhythm-tab" data-rhythm="1">Pop Standard (B - B H - H B H)</button>
            <button class="rhythm-tab" data-rhythm="2">Reggae / Ska (Contretemps)</button>
            <button class="rhythm-tab" data-rhythm="3">Arpège Doux (1-2-3-4)</button>
          </div>
          <div class="rhythm-display">
            <div class="rhythm-arrows" id="rhythm-arrows-display">⬇️ ⬇️⬆️ ⬆️⬇️⬆️</div>
            <p id="rhythm-desc">Le rythme le plus polyvalent pour débuter.</p>
            <button id="play-rhythm-btn" class="btn-secondary">▶️ Écouter le rythme</button>
          </div>
        </div>
      </section>

      <!-- SECTION 2: TUNER -->
      <section id="sec-tuner" class="tab-content">
        <div class="tuner-card">
          <h2>Accordeur de Référence</h2>
          <p class="subtitle">Cliquez sur une note pour l'entendre et accorder votre corde.</p>
          <div class="tuner-pegs">
            <button class="peg-btn" data-note="G"><strong>G</strong> <small>(Sol)</small></button>
            <button class="peg-btn" data-note="C"><strong>C</strong> <small>(Do)</small></button>
            <button class="peg-btn" data-note="E"><strong>E</strong> <small>(Mi)</small></button>
            <button class="peg-btn" data-note="A"><strong>A</strong> <small>(La)</small></button>
          </div>
          <div class="tuner-visualizer">
            <div class="string-line" id="string-g"></div>
            <div class="string-line" id="string-c"></div>
            <div class="string-line" id="string-e"></div>
            <div class="string-line" id="string-a"></div>
          </div>
          <button id="stop-tuner-btn" class="btn-danger hidden">Arrêter le son</button>
        </div>
      </section>

      <!-- SECTION 3: METRONOME -->
      <section id="sec-metronome" class="tab-content">
        <div class="metronome-card">
          <h2>Métronome</h2>
          <div class="tempo-display">
            <span id="bpm-value">120</span> <span class="bpm-unit">BPM</span>
          </div>
          <div class="slider-container">
            <input type="range" id="bpm-slider" min="40" max="240" value="120">
          </div>
          <div class="metronome-controls">
            <button id="tempo-minus" class="btn-round">-</button>
            <button id="metro-toggle-btn" class="btn-primary btn-large">DÉMARRER</button>
            <button id="tempo-plus" class="btn-round">+</button>
          </div>
          <div class="time-signature-selector">
            <label><input type="radio" name="time-sig" value="4" checked> 4/4</label>
            <label><input type="radio" name="time-sig" value="3"> 3/4</label>
            <label><input type="radio" name="time-sig" value="2"> 2/4</label>
          </div>
          <div class="visual-beat-container" id="beat-indicators">
            <div class="beat-dot active"></div>
            <div class="beat-dot"></div>
            <div class="beat-dot"></div>
            <div class="beat-dot"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="app-nav">
      <button class="nav-item active" data-target="sec-chords">
        <span class="nav-icon">🎸</span>
        <span class="nav-label">Accords</span>
      </button>
      <button class="nav-item" data-target="sec-tuner">
        <span class="nav-icon">🔧</span>
        <span class="nav-label">Accordeur</span>
      </button>
      <button class="nav-item" data-target="sec-metronome">
        <span class="nav-icon">⏱️</span>
        <span class="nav-label">Métronome</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
