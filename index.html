<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UkuAcademy - Apprendre le Ukulélé</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪕</text></svg>">
</head>
<body class="dark-mode">
  <header>
    <div class="header-left">
      <h1>🪕 UkuAcademy</h1>
    </div>
    <div class="header-right">
      <button id="installBtn" class="btn-icon" title="Installer l'application" style="display: none;">📥</button>
      <button id="themeToggle" class="btn-icon" title="Changer de thème">☀️</button>
    </div>
  </header>

  <main>
    <!-- SECTION 1: PROGRESSIONS -->
    <section id="progressions-tab" class="tab-content active">
      <div class="selector-container">
        <label for="progressionSelect">Séquence d'accords :</label>
        <select id="progressionSelect"></select>
      </div>

      <div class="progression-info">
        <span id="progGenre" class="badge">Genre</span>
        <span id="progDifficulty" class="badge">Difficulté</span>
        <div class="rhythm-box">
          <strong>Rythmique suggérée :</strong> <span id="progRhythm">D-DU-UDU</span>
        </div>
      </div>

      <div class="chords-display-container">
        <div id="chordsGrid" class="chords-grid"></div>
      </div>

      <div class="controls-row">
        <button id="playProgressionBtn" class="btn btn-primary">▶ Écouter la Séquence</button>
        <button id="strumProgressionBtn" class="btn btn-secondary">🎸 Gratter Tout</button>
      </div>
    </section>

    <!-- SECTION 2: ACCORDEUR -->
    <section id="tuner-tab" class="tab-content">
      <div class="tuner-container">
        <h2>Accordeur Chromatique</h2>
        <p class="subtitle">Jouez une corde ou utilisez les notes de référence ci-dessous.</p>
        
        <div class="tuner-visual">
          <div class="tuner-gauge">
            <div id="tunerNeedle" class="tuner-needle"></div>
            <div class="tuner-center-mark"></div>
          </div>
          <div id="detectedNote" class="detected-note">-</div>
          <div id="detuneAmount" class="detune-amount">En attente...</div>
        </div>

        <div class="reference-notes">
          <button class="ref-note-btn" data-note="G">G (Sol)</button>
          <button class="ref-note-btn" data-note="C">C (Do)</button>
          <button class="ref-note-btn" data-note="E">E (Mi)</button>
          <button class="ref-note-btn" data-note="A">A (La)</button>
        </div>

        <button id="micToggleBtn" class="btn btn-primary">🎤 Activer le Micro</button>
      </div>
    </section>

    <!-- SECTION 3: METRONOME -->
    <section id="metronome-tab" class="tab-content">
      <div class="metronome-container">
        <h2>Métronome</h2>
        <div class="metro-display">
          <div id="metroVisual" class="metro-visual-dot"></div>
          <div id="bpmDisplay" class="bpm-display">120 <span class="bpm-unit">BPM</span></div>
        </div>

        <div class="metro-controls">
          <input type="range" id="bpmSlider" min="40" max="240" value="120">
          <div class="bpm-buttons">
            <button id="bpmMinus" class="btn btn-small">-</button>
            <button id="bpmPlus" class="btn btn-small">+</button>
          </div>
        </div>

        <div class="time-signature-container">
          <button class="sig-btn active" data-sig="4">4/4</button>
          <button class="sig-btn" data-sig="3">3/4</button>
          <button class="sig-btn" data-sig="2">2/4</button>
        </div>

        <button id="metroPlayBtn" class="btn btn-primary btn-large">Démarrer</button>
      </div>
    </section>

    <!-- SECTION 4: DICTIONNAIRE -->
    <section id="library-tab" class="tab-content">
      <div class="library-container">
        <h2>Dictionnaire d'Accords</h2>
        <div class="search-box">
          <input type="text" id="chordSearch" placeholder="Rechercher un accord (ex: C, Am, G7...)">
        </div>
        <div id="libraryGrid" class="chords-grid library-grid"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="progressions-tab">
      <span class="nav-icon">🎵</span>
      <span class="nav-label">Suites</span>
    </button>
    <button class="nav-item" data-tab="tuner-tab">
      <span class="nav-icon">🎸</span>
      <span class="nav-label">Accordeur</span>
    </button>
    <button class="nav-item" data-tab="metronome-tab">
      <span class="nav-icon">⏱️</span>
      <span class="nav-label">Métronome</span>
    </button>
    <button class="nav-item" data-tab="library-tab">
      <span class="nav-icon">📖</span>
      <span class="nav-label">Dico</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
